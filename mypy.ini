[mypy]
# Target version for type checking. The original "python_version >= 3.11"
# line here was malformed (unrecognized option), so mypy always fell back to
# the running interpreter. Pin 3.12: aiosendspin (installed extra, followed
# via imports) uses 3.12-only syntax, so 3.11 cannot parse the import graph.
python_version = 3.12
warn_return_any = True
warn_unused_configs = True

# The lint gate installs only -e .[dev]; the sendspin/tray extras and the
# hardware libraries below are absent (or untyped) in some environments.
# Analyze them as Any everywhere so local (extras installed) and CI agree.
ignore_missing_imports = True

[mypy-aioesphomeapi.api_pb2]
allow_subclassing_any = True
disable_error_code = attr-defined
