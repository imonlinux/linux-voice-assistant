# ALSA client configuration for the ReSpeaker 2-Mics Pi HAT.
# Provides a sane default device: plug layer over dmix (playback) and
# dsnoop (capture) on the seeed2micvoicec card, with libsamplerate
# resampling (speexdsp resampling is lower quality).
#
# Derived from HinTak/seeed-voicecard (asound_2mic.conf),
# Copyright (c) Seeed Technology Co., Ltd, MIT license.
# The card ID "seeed2micvoicec" is unchanged under the mainline-only
# install path.

# The IPC key of dmix or dsnoop plugin must be unique
# If 555555 or 666666 is used by other processes, use another one

pcm.!default {
    type asym
    playback.pcm "playback"
    capture.pcm "capture"
}

pcm.playback {
    type plug
    slave.pcm "dmixed"
}

pcm.capture {
    type plug
    slave.pcm "array"
}

pcm.dmixed {
    type dmix
    slave.pcm "hw:seeed2micvoicec"
    ipc_key 555555
}

pcm.array {
    type dsnoop
    slave {
        pcm "hw:seeed2micvoicec"
        channels 2
    }
    ipc_key 666666
}
